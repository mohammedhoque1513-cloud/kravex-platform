name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kravex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kravex_test?schema=public
      NEXTAUTH_SECRET: ci-only-secret-change-for-production
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      DISABLE_LOCAL_FALLBACK: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Generate isolated test credentials
        run: |
          ADMIN_PASSWORD="$(openssl rand -base64 24)"
          CLIENT_PASSWORD="$(openssl rand -base64 24)"
          echo "E2E_ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          echo "SEED_ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          echo "E2E_CLIENT_PASSWORD=$CLIENT_PASSWORD" >> "$GITHUB_ENV"
          echo "SEED_CLIENT_PASSWORD=$CLIENT_PASSWORD" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npx tsc --noEmit
      - run: npm run security:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
